name: Build container images

on:
  push:
    branches:
      - '*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/endlessm/godot-build-containers/godot-fedora:${{ github.ref_name }}-f44
  WEB_IMAGE: ghcr.io/endlessm/godot-build-containers/godot-web:${{ github.ref_name }}-f44

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push base image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}
          cache-to: type=inline

  web:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            base_image=${{ env.BASE_IMAGE }}
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}
          cache-to: type=inline
